<!DOCTYPE html>
<html>
<head>
<title>Laptop Landing Page</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #eef2f5;
        text-align: center;
        margin: 0;
        padding: 40px 0;
    }

    .card {
        width: 320px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
    }

    .card img {
        width: 100%;
        border-radius: 10px;
    }

    .card h2 {
        color: #222;
        margin: 15px 0 5px;
    }

    .price {
        font-size: 22px;
        color: #e63946;
        font-weight: bold;
        margin: 10px 0;
    }

    ul {
        text-align: left;
        margin: 15px 0;
        padding-left: 20px;
        color: #444;
    }

    .buy-btn {
        width: 100%;
        padding: 12px;
        background-color: #1d3557;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    .buy-btn:hover {
        background-color: #457b9d;
    }
</style>
</head>
<body>

    <div class="card">
        <img src="images.jpg" alt="Laptop">
        <h2>Mac Book Pro</h2>

        <ul>
            <li>Intel Core i7, 12th Gen</li>
            <li>16GB RAM / 512GB SSD</li>
            <li>15.6" Full HD Display</li>
            <li>Backlit Keyboard</li>
            <li>10 Hours Battery Life</li>
        </ul>

        <p class="price">₹65,999</p>

        <button class="buy-btn">Buy Now</button>
    </div>

</body>
</html>
